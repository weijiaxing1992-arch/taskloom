<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#507BFD"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="/src/assets/taskloom-mark.svg" type="image/svg+xml"><title>TaskLoom · 星河示例企业研发协作</title></head><body><div id="app"></div><script type="module">
// 小屏幕直接进入独立 React 工作台；desktop=1 是详情页/登录页的显式回桌面开关，避免循环跳转。
const query = new URLSearchParams(window.location.search)
const mobileViewport = window.matchMedia('(max-width: 820px)').matches
const mobilePreferred = query.get('desktop') !== '1' && (query.get('mobile') === '1' || mobileViewport)
// 四个入口共享 React 移动端，保留项目和详情参数。
const mobileCoreRoute = ['/', '/my-work', '/requirements', '/iterations', '/notifications'].includes(window.location.pathname)
if (mobilePreferred && mobileCoreRoute) {
  const tab = ({'/requirements':'requirements','/iterations':'iterations','/notifications':'notifications'})[window.location.pathname] || 'work'
  query.set('tab',tab)
  window.location.replace(`/mobile.html?${query}`)
} else if (window.location.pathname === '/') {
  // 只有桌面根地址进入官方门户；业务深链接继续加载原工作台，避免门户与业务路由相互抢跳转。
  window.location.replace('/my-work' + window.location.search + window.location.hash)
} else import('/src/main.ts')
</script></body></html>
